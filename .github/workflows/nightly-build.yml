name: Nightly Build

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit hash to build'
        required: false
        default: 'dd326c7564c7a50ebae7b6fed73b3a1682a9f145'
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/src/main/go/go.mod
          cache: false

      # Must match the default ndkVersion in app/build.gradle.kts. The Go build
      # looks for this exact directory under $ANDROID_HOME/ndk.
      - name: Set up Android NDK and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" "build-tools;37.0.0"

      - name: Grant execution permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build F-Droid Release APK
        run: ./gradlew assembleFdroidRelease

      - name: Sign app APK
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASS \
            --key-pass env:KEYSTORE_PASS \
            --out Athena-nightly.apk \
            app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Extract nightly changelog
        run: |
          sed -n '/## \[Nightly\]/,/## \[/p' CHANGELOG.md | sed '$ d' | tail -n +2 > nightly-changelog.txt
          echo "" >> nightly-changelog.txt
          echo "---" >> nightly-changelog.txt
          echo "" >> nightly-changelog.txt
          echo "**Build Info:**" >> nightly-changelog.txt
          echo "- Commit: \`${{ github.sha }}\`" >> nightly-changelog.txt
          echo "- Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> nightly-changelog.txt

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: Athena-Nightly
          path: Athena-nightly.apk

      - name: Update nightly release
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/Nightly" -f sha="$GITHUB_SHA" -F force=true
          gh release upload Nightly Athena-nightly.apk --clobber
          gh release edit Nightly --prerelease --notes-file nightly-changelog.txt
